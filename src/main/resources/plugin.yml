name: ShulfurHunt
version: 1.2.0
main: com.shulfur.hunt.HiddenTreasuresPlugin
api-version: '26.3'
author: SHULFUR SMP
description: "THE 12 HIDDEN TREASURES - find 12 Obsidian Blocks to unlock the Nether."

commands:
  huntset:
    description: Place or remove a hidden treasure chest.
    usage: "/huntset (1-12) (clue)  |  /huntset (1-12) remove"
    permission: shulfur.hunt.admin
  huntclue:
    description: Show the next clue.
    usage: "/huntclue"
    permission: shulfur.hunt.player
  huntstart:
    description: Start the Hidden Treasures event.
    usage: "/huntstart"
    permission: shulfur.hunt.admin
  huntstop:
    description: Pause the event.
    usage: "/huntstop"
    permission: shulfur.hunt.admin
  huntstatus:
    description: Show event progress.
    usage: "/huntstatus"
    permission: shulfur.hunt.player
  huntreset:
    description: Reset all progress and refill chests.
    usage: "/huntreset confirm"
    permission: shulfur.hunt.admin
  huntnether:
    description: Open, lock or inspect the Nether gate.
    usage: "/huntnether open | lock | status"
    permission: shulfur.hunt.admin

permissions:
  shulfur.hunt.admin:
    description: Manage the Hidden Treasures event and the Nether gate.
    default: op
  shulfur.hunt.player:
    description: Play the event and view clues and status.
    default: true
