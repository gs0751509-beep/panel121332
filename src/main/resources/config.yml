# ==========================================================
#  SHULFUR SMP - THE 12 HIDDEN TREASURES
#  Messages use MiniMessage formatting.
# ==========================================================

nether:
  # true  = the Nether opens automatically when the 12th Shulfur Core is claimed.
  # false = an admin opens it with /huntnether open (recommended).
  auto-open-on-completion: false

prize:
  # Exact in-game name (case does not matter). Receives every Shulfur Core.
  target-player: "GAuravxd"
  # Given once, to the player who opens the first treasure chest.
  first-finder-item: "FLINT_AND_STEEL"

messages:
  prefix: "<color:#B8860B>『</color><color:#FFD700><b> SHULFUR HUNT </b></color><color:#B8860B>』</color> "
  player-only: "<red>Only players can use this command.</red>"
  usage-set: "<red>Usage: /huntset (1-12) (clue)  or  /huntset (1-12) remove</red>"
  usage-nether: "<red>Usage: /huntnether open | lock | status</red>"
  usage-auto: "<red>Usage: /huntauto (min) (max)  Example: /huntauto 500 1000</red>"
  auto-range-invalid: "<red>Range must be 100 to 5000 blocks, with min less than max.</red>"
  auto-started: "<gray>Placing treasures in the background. This can take a little while, you will get a message when done.</gray>"
  auto-busy: "<red>Treasure placement is already running. Please wait.</red>"
  auto-done: "<green>All 12 treasures placed between <min> and <max> blocks from spawn. Run /huntstatus, then /huntstart.</green>"
  auto-partial: "<red>Only <placed>/12 treasures could be placed. Run /huntauto again.</red>"
  invalid-id: "<red>Treasure number must be between 1 and <total>.</red>"
  set-running: "<red>Stop the hunt with /huntstop before changing treasures.</red>"
  set-no-chest: "<red>Look directly at a single chest (within 5 blocks) and try again.</red>"
  set-double-chest: "<red>Double chests cannot be used. Choose a single chest.</red>"
  set-duplicate: "<red>That chest is already treasure #<id>.</red>"
  clue-too-long: "<red>Clues must be 160 characters or fewer.</red>"
  set-success: "<green>Treasure #<id> is hidden. Its chest now holds the Shulfur Core and loot.</green>"
  remove-success: "<yellow>Treasure #<id> removed and its chest emptied.</yellow>"
  remove-none: "<red>Treasure #<id> is not set.</red>"
  clue-line: "<gold>Next clue (#<id>):</gold> <white><clue></white>"
  clue-none: "<gold>No clues are available right now.</gold>"
  not-running: "<red>The hunt is not active right now.</red>"
  start-already: "<red>The hunt is already running.</red>"
  start-done: "<gold>All treasures are already claimed. Run /huntreset confirm to start over.</gold>"
  start-missing: "<red>Cannot start: only <count>/<total> treasures are set. Missing: <missing></red>"
  stop-already: "<red>The hunt is not running.</red>"
  status-progress: "<gold>Progress:</gold> <white><count>/<total></white> Shulfur Cores collected"
  status-state: "<gold>Event:</gold> <state>"
  status-nether: "<gold>Nether:</gold> <nether>"
  status-admin: "<gold>Admin:</gold> <gray>unset: <missing> | uncollected: <remaining></gray>"
  status-claimed-header: "<gold>Found so far:</gold>"
  status-claimed-line: "<gray>#<id></gray> <white><name></white>"
  reset-confirm: "<red>This wipes all progress, refills every chest and locks the Nether. Run /huntreset confirm to proceed.</red>"
  reset-done: "<green>Hunt reset. All chests are refilled and the Nether is locked.</green>"
  reset-notice: "<gold>The Hidden Treasures hunt has been reset by an admin.</gold>"
  nether-already-open: "<yellow>The Nether is already open.</yellow>"
  nether-world-missing: "<red>Warning: no Nether world is loaded. Set allow-nether=true in server.properties and restart.</red>"
  nether-lock-done: "<yellow>The Nether is locked again. <moved> player(s) returned to the overworld.</yellow>"
  nether-locked: "<red>The Nether is sealed. Collect all 12 Shulfur Cores to open it.</red>"
  chest-protected: "<red>This hidden chest is protected until its treasure is claimed.</red>"
  claim-self: "<gold>You claimed a Shulfur Core!</gold> <gray>Keep searching for the rest.</gray>"
  claim-pending: "<gray>The Shulfur Core is saved. <gold><target></gold> will receive it when they join.</gray>"
  claim-sent-to-target: "<gray>Shulfur Core sent to <gold><target></gold>.</gray>"
  prize-received: "<gold>You received a Shulfur Core from The 12 Hidden Treasures!</gold>"
  first-finder-bonus: "<gold>You opened the first treasure chest and earned a Flint & Steel!</gold>"
  claim-broadcast: "<gold>[<count>/<total>]</gold> <white><player></white> claimed a Shulfur Core!"
  title-main: "<gold><b>TREASURE FOUND</b></gold>"
  title-sub: "<yellow><player> claimed a Shulfur Core <gray>(<count>/<total>)</gray></yellow>"
  start: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold><newline><gold><b>THE 12 HIDDEN TREASURES HAS BEGUN</b></gold><newline><yellow>12 Shulfur Cores are hidden across the world. Find them all to unlock the Nether!</yellow><newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold>"
  stop: "<red>The Hidden Treasures hunt has been paused by an admin.</red>"
  milestone: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold><newline><gold><b>MILESTONE  <count>/<total></b></gold><newline><yellow>The hidden treasures are giving up their secrets...</yellow><newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold>"
  next-clue: "<gold>Next clue (#<id>):</gold> <white><clue></white>"
  complete: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold><newline><gold><b>12/12 - ALL SHULFUR CORES CLAIMED</b></gold><newline><yellow>The Nether is READY TO OPEN!</yellow><newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold>"
  complete-manual: "<yellow>An admin will open the Nether shortly. Stay tuned.</yellow>"
  nether-open: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold><newline><gold><b>THE NETHER IS NOW OPEN</b></gold><newline><yellow>Portals are active. Good luck, and watch the lava.</yellow><newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━</gold>"

reward:
  name: "<gradient:#FFD700:#B8860B><b>✦ Shulfur Core ✦</b></gradient>"
  lore:
    - "<gray>A relic from the 12 Hidden Treasures.</gray>"
    - "<dark_gray>Collect all 12 to awaken the Nether.</dark_gray>"

# Loot entries. Each one rolls its chance, then drops several separate stacks.
#   stacks-min / stacks-max : how many separate stacks to drop
#   amount-min / amount-max : items per stack (capped at the material's max stack size)
loot:
  diamond:
    material: DIAMOND
    chance: 0.6
    stacks-min: 1
    stacks-max: 3
    amount-min: 1
    amount-max: 4
  emerald:
    material: EMERALD
    chance: 0.6
    stacks-min: 1
    stacks-max: 3
    amount-min: 2
    amount-max: 6
  netherite-ingot:
    material: NETHERITE_INGOT
    chance: 0.2
    stacks-min: 1
    stacks-max: 1
    amount-min: 1
    amount-max: 1
  iron:
    material: IRON_INGOT
    chance: 0.9
    stacks-min: 2
    stacks-max: 4
    amount-min: 4
    amount-max: 12
  gold:
    material: GOLD_INGOT
    chance: 0.8
    stacks-min: 2
    stacks-max: 3
    amount-min: 4
    amount-max: 10
  golden-apple:
    material: GOLDEN_APPLE
    chance: 0.5
    stacks-min: 1
    stacks-max: 2
    amount-min: 1
    amount-max: 2
  lapis:
    material: LAPIS_LAZULI
    chance: 0.8
    stacks-min: 1
    stacks-max: 2
    amount-min: 8
    amount-max: 20
  ender-pearl:
    material: ENDER_PEARL
    chance: 0.4
    stacks-min: 1
    stacks-max: 2
    amount-min: 1
    amount-max: 4
  bread:
    material: BREAD
    chance: 0.9
    stacks-min: 1
    stacks-max: 2
    amount-min: 8
    amount-max: 16

trims:
  - SENTRY_ARMOR_TRIM_SMITHING_TEMPLATE
  - DUNE_ARMOR_TRIM_SMITHING_TEMPLATE
  - COAST_ARMOR_TRIM_SMITHING_TEMPLATE
  - WILD_ARMOR_TRIM_SMITHING_TEMPLATE
  - WARD_ARMOR_TRIM_SMITHING_TEMPLATE
  - EYE_ARMOR_TRIM_SMITHING_TEMPLATE
  - VEX_ARMOR_TRIM_SMITHING_TEMPLATE
  - TIDE_ARMOR_TRIM_SMITHING_TEMPLATE
  - SNOUT_ARMOR_TRIM_SMITHING_TEMPLATE
  - RIB_ARMOR_TRIM_SMITHING_TEMPLATE
  - SPIRE_ARMOR_TRIM_SMITHING_TEMPLATE
  - FLOW_ARMOR_TRIM_SMITHING_TEMPLATE
  - BOLT_ARMOR_TRIM_SMITHING_TEMPLATE
